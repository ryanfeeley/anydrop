<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="description" content="Share files directly between browsers. No account required.">
  <title>Anydrop — Share files between devices</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Anydrop home">
        <span class="brand-mark" aria-hidden="true">↔</span>
        <span>anydrop</span>
      </a>
      <button id="sound-toggle" type="button" class="icon-button sound-toggle" aria-label="Turn sounds off" title="Toggle sounds">
        <span aria-hidden="true">♪</span><span class="sound-label">Sound on</span>
      </button>
    </header>

    <section class="app-card" aria-label="File sharing">
      <div class="status-bar">
        <span class="status-indicator" id="status-indicator"></span>
        <span id="connection-status">Starting…</span>
      </div>
      <div id="app" class="app-content">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Getting ready…</h1>
        <p>Preparing your private connection link.</p>
      </div>
      <div class="card-footer">
        <span id="footer-description">No account or app required</span>
        <button id="disconnect-button" class="text-button hidden" type="button">Disconnect</button>
      </div>
    </section>

    <footer class="site-footer">
      <p>Files travel over an encrypted browser-to-browser connection. A signaling service helps devices find each other; restrictive networks may prevent a connection.</p>
      <a href="https://github.com/ryanfeeley/anydrop" target="_blank" rel="noopener noreferrer">Open source on GitHub</a>
    </footer>
  </main>

  <input type="file" id="file-input" multiple hidden>
  <canvas id="scan-canvas" hidden></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
